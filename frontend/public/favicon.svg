<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#07172c" />
      <stop offset="100%" stop-color="#050B14" />
    </radialGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark navy circular container -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Outer subtle radar ping circle -->
  <circle cx="32" cy="32" r="23" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Bioluminescent Ocean Droplet & Wave Monogram -->
  <g filter="url(#glow)">
    <!-- Dynamic ocean wave curve -->
    <path
      d="M16 38 C 22 26, 28 42, 34 31 C 40 20, 48 35, 48 37 C 45 44, 39 48, 32 48 C 25 48, 19 44, 16 38 Z"
      fill="url(#waveGlow)"
      fill-opacity="0.85"
    />
    <!-- Satellite beacon / subsurface droplet -->
    <circle cx="32" cy="20" r="4.5" fill="#22d3ee" />
    <circle cx="32" cy="20" r="8" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.2" />
  </g>
</svg>
